<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Robô de Trade</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Robô de Trade — Painel de Controle</h1>
      <span id="connectionBadge" class="badge offline">Desconectado</span>
    </header>

    <main class="grid">
      <section class="card">
        <h2>Configuração de Operação</h2>
        <form id="configForm" class="form-grid">
          <label>
            Par
            <input id="symbol" type="text" value="BTCUSDT" required />
          </label>

          <label>
            Mercado
            <select id="market">
              <option value="spot">Spot</option>
              <option value="futures" selected>Futures</option>
            </select>
          </label>

          <label>
            Modo
            <select id="mode">
              <option value="paper" selected>Paper</option>
              <option value="live">Live</option>
            </select>
          </label>

          <label>
            Risco por trade (%)
            <input id="riskPerTrade" type="number" min="0.1" step="0.1" value="1.0" required />
          </label>

          <label>
            Stop diário (%)
            <input id="maxDailyLoss" type="number" min="0.1" step="0.1" value="2.0" required />
          </label>

          <label>
            Máx. trades/dia
            <input id="maxTrades" type="number" min="1" step="1" value="8" required />
          </label>

          <button type="submit">Salvar configuração</button>
        </form>
      </section>

      <section class="card">
        <h2>Status do Robô</h2>
        <div class="stats">
          <div><strong>Estado:</strong> <span id="botState">Parado</span></div>
          <div><strong>Trades hoje:</strong> <span id="tradesToday">0</span></div>
          <div><strong>PnL diário:</strong> <span id="dailyPnl">0.00%</span></div>
          <div><strong>Último sinal:</strong> <span id="lastSignal">-</span></div>
        </div>

        <div class="controls">
          <button id="startBtn" class="success">Iniciar</button>
          <button id="pauseBtn" class="warning">Pausar</button>
          <button id="stopBtn" class="danger">Parar</button>
        </div>
      </section>

      <section class="card logs">
        <h2>Logs</h2>
        <ul id="logList"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
